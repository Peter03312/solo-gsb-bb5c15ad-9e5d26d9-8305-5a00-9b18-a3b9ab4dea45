services:
  rotor-balance:
    build: .
    image: rotor-balance:latest
    container_name: rotor-balance
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # 容器内监听端口（左侧主机映射端口可用环境变量 PORT 覆盖）
      PORT: "8080"
      HOST: "0.0.0.0"
      DB_PATH: "/app/data/rotor.db"
    volumes:
      - rotor-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/state').then(r=>{if(r.status!==200)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  rotor-data:
